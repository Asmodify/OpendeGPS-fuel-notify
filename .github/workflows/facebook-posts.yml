name: Facebook posts

# Manual runs only. To post on a timer again, add back:
#   schedule:
#     - cron: "0 2 * * 1,3,5"   # Mon, Wed, Fri at 10:00 Ulaanbaatar time
on:
  workflow_dispatch:
    inputs:
      live:
        description: "Really post (otherwise dry run)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: facebook-posts
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Queue status
        run: python facebook/fb_poster.py list
      - name: Post due posts
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          # Live only when the FB_LIVE repo variable is "true" and the manual run ticks "live".
          FB_LIVE: ${{ (vars.FB_LIVE == 'true' && inputs.live) && '1' || '0' }}
        run: python facebook/fb_poster.py run
      - name: Save posted ids
        if: always()
        run: |
          if ! git diff --quiet facebook/posts.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "facebook: record published posts"
            git push
          fi
